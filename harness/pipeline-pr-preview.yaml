# PR CI. Default buildTarget contabo so the check runs while the
# local-kind delegate is offline. Push is Docker Hub, not kind Zot.
# The ephemeral Ingress preview stays on kind (service account
# harness-games-preview and the home ingress). It is scheduled only when
# buildTarget=local_kind. Contabo has no matching preview ingress, and the
# wildcard DNS still points at the home cluster.
pipeline:
  name: PR Preview TicTacToe
  identifier: PR_Preview_TicTacToe_Local_Kind
  projectIdentifier: default_project
  orgIdentifier: default
  tags:
    app: tictactoe
    target: contabo
    purpose: pr-preview
  properties:
    ci:
      codebase:
        connectorRef: account.Github
        repoName: Ironmanburns/burnsy-tictactoe
        build: <+input>
  variables:
    - name: buildTarget
      type: String
      description: "CI cluster. auto and contabo use contabo_k8s. local_kind uses local_kind_k8s and also deploys the kind preview."
      value: contabo
    - name: imageRegistryHost
      type: String
      value: docker.io
    - name: imageRegistryUser
      type: String
      description: Docker Hub login for the push. Connector my_docker username. Not a secret.
      value: ironmanburns
    - name: imageNamespace
      type: String
      value: ironmanburns
    - name: imageRepo
      type: String
      value: tictactoe
    - name: imageTag
      type: String
      description: Stable per PR so a kind preview can pull the same tag. Also pushed as the commit SHA.
      value: pr-<+trigger.prNumber>
    - name: appName
      type: String
      value: tictactoe
  stages:
    - stage:
        name: Build contabo
        identifier: Build_contabo
        description: PR build on contabo_k8s. Push docker.io/ironmanburns. Trivy CRITICAL gate. No kind connector and no Zot.
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.buildTarget> == "contabo" || <+pipeline.variables.buildTarget> == "auto"
        delegateSelectors:
          - contabo
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: contabo_k8s
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and Push
                  identifier: Build_and_Push
                  spec:
                    connectorRef: my_docker
                    image: gcr.io/kaniko-project/executor:v1.23.2-debug
                    shell: Sh
                    envVariables:
                      DOCKER_USER: <+pipeline.variables.imageRegistryUser>
                      DOCKER_PASS: <+secrets.getValue("docker_password")>
                    command: |-
                      set -eu
                      mkdir -p /kaniko/.docker
                      AUTH=$(printf '%s:%s' "$DOCKER_USER" "$DOCKER_PASS" | base64 | tr -d '\n')
                      printf '%s\n' "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"},\"docker.io\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
                      unset DOCKER_PASS AUTH
                      HOST="<+pipeline.variables.imageRegistryHost>"
                      NAMESPACE="<+pipeline.variables.imageNamespace>"
                      REPO="<+pipeline.variables.imageRepo>"
                      TAG="<+pipeline.variables.imageTag>"
                      SHA="<+codebase.commitSha>"
                      IMAGE="${HOST}/${NAMESPACE}/${REPO}"
                      echo "Pushing ${IMAGE}:${TAG} and ${IMAGE}:${SHA}"
                      /kaniko/executor \
                        --dockerfile=Dockerfile \
                        --context=dir:///harness \
                        --destination="${IMAGE}:${TAG}" \
                        --destination="${IMAGE}:${SHA}" \
                        --ignore-path=/product_uuid \
                        --snapshot-mode=redo
              - step:
                  type: Run
                  name: Trivy Image Scan
                  identifier: Trivy_Image_Scan
                  spec:
                    connectorRef: my_docker
                    image: aquasec/trivy:0.57.1
                    shell: Sh
                    envVariables:
                      DOCKER_USER: <+pipeline.variables.imageRegistryUser>
                      DOCKER_PASS: <+secrets.getValue("docker_password")>
                    command: |-
                      set -eu
                      mkdir -p /root/.docker
                      AUTH=$(printf '%s:%s' "$DOCKER_USER" "$DOCKER_PASS" | base64 | tr -d '\n')
                      printf '%s\n' "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"},\"docker.io\":{\"auth\":\"${AUTH}\"}}}" > /root/.docker/config.json
                      unset DOCKER_PASS AUTH
                      IMAGE="<+pipeline.variables.imageRegistryHost>/<+pipeline.variables.imageNamespace>/<+pipeline.variables.imageRepo>:<+pipeline.variables.imageTag>"
                      echo "Scanning ${IMAGE}"
                      trivy image --severity CRITICAL --exit-code 1 --no-progress --timeout 10m "$IMAGE"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
    - stage:
        name: Build local kind
        identifier: Build_local_kind
        description: PR build on local_kind_k8s. Same Docker Hub destination. Runs only when buildTarget=local_kind.
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.buildTarget> == "local_kind"
        delegateSelectors:
          - local-kind
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: local_kind_k8s
              namespace: harness-ci
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Build and Push
                  identifier: Build_and_Push
                  spec:
                    connectorRef: my_docker
                    image: gcr.io/kaniko-project/executor:v1.23.2-debug
                    shell: Sh
                    envVariables:
                      DOCKER_USER: <+pipeline.variables.imageRegistryUser>
                      DOCKER_PASS: <+secrets.getValue("docker_password")>
                    command: |-
                      set -eu
                      mkdir -p /kaniko/.docker
                      AUTH=$(printf '%s:%s' "$DOCKER_USER" "$DOCKER_PASS" | base64 | tr -d '\n')
                      printf '%s\n' "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"},\"docker.io\":{\"auth\":\"${AUTH}\"}}}" > /kaniko/.docker/config.json
                      unset DOCKER_PASS AUTH
                      HOST="<+pipeline.variables.imageRegistryHost>"
                      NAMESPACE="<+pipeline.variables.imageNamespace>"
                      REPO="<+pipeline.variables.imageRepo>"
                      TAG="<+pipeline.variables.imageTag>"
                      SHA="<+codebase.commitSha>"
                      IMAGE="${HOST}/${NAMESPACE}/${REPO}"
                      echo "Pushing ${IMAGE}:${TAG} and ${IMAGE}:${SHA}"
                      /kaniko/executor \
                        --dockerfile=Dockerfile \
                        --context=dir:///harness \
                        --destination="${IMAGE}:${TAG}" \
                        --destination="${IMAGE}:${SHA}" \
                        --ignore-path=/product_uuid \
                        --snapshot-mode=redo
              - step:
                  type: Run
                  name: Trivy Image Scan
                  identifier: Trivy_Image_Scan
                  spec:
                    connectorRef: my_docker
                    image: aquasec/trivy:0.57.1
                    shell: Sh
                    envVariables:
                      DOCKER_USER: <+pipeline.variables.imageRegistryUser>
                      DOCKER_PASS: <+secrets.getValue("docker_password")>
                    command: |-
                      set -eu
                      mkdir -p /root/.docker
                      AUTH=$(printf '%s:%s' "$DOCKER_USER" "$DOCKER_PASS" | base64 | tr -d '\n')
                      printf '%s\n' "{\"auths\":{\"https://index.docker.io/v1/\":{\"auth\":\"${AUTH}\"},\"docker.io\":{\"auth\":\"${AUTH}\"}}}" > /root/.docker/config.json
                      unset DOCKER_PASS AUTH
                      IMAGE="<+pipeline.variables.imageRegistryHost>/<+pipeline.variables.imageNamespace>/<+pipeline.variables.imageRepo>:<+pipeline.variables.imageTag>"
                      echo "Scanning ${IMAGE}"
                      trivy image --severity CRITICAL --exit-code 1 --no-progress --timeout 10m "$IMAGE"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
    - stage:
        name: Preview Deploy
        identifier: Preview_Deploy
        description: Ephemeral Helm release plus Ingress on kind. Not scheduled unless buildTarget=local_kind.
        type: CI
        when:
          pipelineStatus: Success
          condition: <+pipeline.variables.buildTarget> == "local_kind" && (<+pipeline.stages.Build_contabo.status> == "SUCCESS" || <+pipeline.stages.Build_local_kind.status> == "SUCCESS")
        delegateSelectors:
          - local-kind
        spec:
          cloneCodebase: true
          infrastructure:
            type: KubernetesDirect
            spec:
              connectorRef: local_kind_k8s
              namespace: harness-ci
              serviceAccountName: harness-games-preview
              automountServiceAccountToken: true
              nodeSelector: {}
              os: Linux
          execution:
            steps:
              - step:
                  type: Run
                  name: Helm Preview Deploy
                  identifier: Helm_Preview_Deploy
                  spec:
                    connectorRef: my_docker
                    image: alpine/helm:3.16.3
                    shell: Sh
                    command: |-
                      set -eu
                      apk add --no-cache kubectl >/dev/null
                      APP="<+pipeline.variables.appName>"
                      PR="<+trigger.prNumber>"
                      NS="games-pr-${APP}-${PR}"
                      RELEASE="${APP}-pr-${PR}"
                      HOST="${APP}-pr-${PR}.theburnsasylum.co.uk"
                      TAG="<+pipeline.variables.imageTag>"
                      IMAGE="<+pipeline.variables.imageRegistryHost>/<+pipeline.variables.imageNamespace>/<+pipeline.variables.imageRepo>"
                      echo "Deploying preview ${RELEASE} -> https://${HOST}"
                      kubectl create namespace "${NS}" --dry-run=client -o yaml | kubectl apply -f -
                      helm upgrade --install "${RELEASE}" /harness/charts/${APP} \
                        --namespace "${NS}" \
                        --set image.repository="${IMAGE}" \
                        --set image.tag="${TAG}" \
                        --set service.type=ClusterIP \
                        --set ingress.enabled=true \
                        --set ingress.host="${HOST}" \
                        --wait --timeout 3m
                      # Ingress controller can lag a few seconds behind Endpoints readiness.
                      i=0
                      while [ "$i" -lt 30 ]; do
                        EP=$(kubectl get endpoints "${APP}" -n "${NS}" -o jsonpath='{.subsets[*].addresses[*].ip}' 2>/dev/null || true)
                        if [ -n "${EP}" ]; then
                          break
                        fi
                        i=$((i + 1))
                        sleep 2
                      done
                      echo "Preview URL: https://${HOST}"
        failureStrategies:
          - onFailure:
              errors:
                - AllErrors
              action:
                type: Abort
